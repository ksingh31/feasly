<main class="admin-login">
  <div class="admin-login__card">
    <p class="admin-login__eyebrow">Admin portal</p>
    <h1>Welcome back</h1>

    @if (showExpired) {
      <p class="admin-login__notice" role="status">
        {{ copy.loginExpired }}
      </p>
    }

    <p class="admin-login__intro">{{ copy.entraSignInIntro }}</p>

    @if (entraConfigured) {
      <button
        type="button"
        class="admin-login__submit"
        (click)="startEntraSignIn()"
        [disabled]="entraStarting()"
      >
        @if (entraStarting()) {
          Redirecting…
        } @else {
          {{ copy.entraSignInLabel }}
        }
      </button>
    } @else {
      <p class="admin-login__errorbox" role="alert">
        {{ copy.entraNotConfigured }}
      </p>
    }
  </div>
</main>
