<ui-modal heading="Change payment method" asForm (submitted)="save()">
  <p class="invoice-modal__context">{{ invoice.invoiceNumber }} · {{ invoice.tenantKey }}</p>

  <ui-select label="Payment method" required [formControl]="method" [options]="options" />

  <dl class="invoice-modal__compare" data-testid="method-before-after">
    <div class="invoice-modal__row">
      <dt>Method</dt>
      <dd>
        <span class="invoice-modal__before">{{ before }}</span>
        <span aria-hidden="true">→</span><span class="sr-only">to</span>
        <strong class="invoice-modal__after">{{ changed() ? after() : before }}</strong>
      </dd>
    </div>
  </dl>

  @if (consequence(); as text) {
    <p class="invoice-modal__note" data-testid="method-consequence">{{ text }}</p>
  } @else {
    <p class="invoice-modal__note">Pick a different method to change how this invoice gets paid.</p>
  }

  @if (error(); as err) {
    <p class="invoice-modal__alert" role="alert">{{ err }}</p>
  }

  <ng-container uiModalFooter>
    <button type="button" ui-button variant="secondary" (click)="cancel()">Cancel</button>
    <button type="submit" ui-button data-testid="method-submit" [loading]="submitting()" [disabled]="!canSave()">
      Change method
    </button>
  </ng-container>
</ui-modal>
