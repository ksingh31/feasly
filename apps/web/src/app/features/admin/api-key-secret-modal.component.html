<ui-modal [heading]="copy.secretTitle" [closable]="false">
  <div class="secret-modal" data-testid="secret-modal">
    <p class="secret-modal__warning" role="note">{{ copy.plaintextWarning }}</p>
    @if (keyName(); as name) {
      <p class="secret-modal__name">{{ name }}</p>
    }
    <label class="secret-modal__label" for="api-key-secret-value">{{ copy.secretLabel }}</label>
    <div class="secret-modal__row">
      <input
        id="api-key-secret-value"
        class="secret-modal__value"
        type="text"
        readonly
        spellcheck="false"
        autocomplete="off"
        data-testid="secret-value"
        [value]="plaintext() ?? ''"
        (focus)="selectAll($event)"
        (click)="selectAll($event)"
      />
      <button
        type="button"
        ui-button
        variant="secondary"
        data-testid="copy-secret"
        cdkFocusInitial
        (click)="copyKey()"
      >
        {{ copyState() === 'copied' ? copy.copiedButton : copy.copyButton }}
      </button>
    </div>
    <p class="secret-modal__status" aria-live="polite">
      @if (copyState() === 'copied') {
        {{ copy.copiedButton }}
      } @else if (copyState() === 'failed') {
        <span class="secret-modal__error">{{ copy.copyFailed }}</span>
      }
    </p>
    <label class="secret-modal__ack">
      <input type="checkbox" data-testid="secret-ack" [checked]="acknowledged()" (change)="onAck($event)" />
      <span>{{ copy.ackLabel }}</span>
    </label>
  </div>
  <ng-container uiModalFooter>
    <button type="button" ui-button data-testid="secret-done" [disabled]="!acknowledged()" (click)="done()">
      {{ copy.doneButton }}
    </button>
  </ng-container>
</ui-modal>
