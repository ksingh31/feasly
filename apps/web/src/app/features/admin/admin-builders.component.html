<div class="builders-page">
  <ui-page-header
    heading="Builders"
    description="The building companies that receive your leads: branding, sign-in key, commission rate, and embed websites."
  >
    @if (canManageBuilders()) {
      <button uiPageHeaderActions type="button" ui-button data-testid="add-builder" (click)="startCreate()">
        Add builder
      </button>
    }
  </ui-page-header>

  <ui-data-table
    label="Builders"
    [rows]="builders()"
    [columns]="columns"
    [rowId]="rowId"
    [loading]="listStatus() === 'loading'"
    [error]="listStatus() === 'error' ? listError() : null"
    [selectedId]="openId()"
    emptyHeading="No builders yet"
    emptyMessage="Add your first builder to set up their branding, sign-in key, and the websites their estimator runs on."
    errorHeading="Couldn't load builders"
    retryLabel="Try again"
    (retry)="retry()"
    (open)="openBuilder($event)"
  >
    <ng-template uiCell="builder" let-row>
      <span class="builders-page__builder-cell">
        <span class="builders-page__avatar" aria-hidden="true">
          @if (row.logoUrl && !logoFailed().has(row.id)) {
            <img [src]="row.logoUrl" alt="" (error)="onLogoError(row.id)" />
          } @else {
            {{ initials(row.businessName) }}
          }
        </span>
        <span class="builders-page__names">
          <span class="builders-page__name">{{ row.businessName }}</span>
          <code class="builders-page__slug">{{ row.tenantKey }}</code>
        </span>
      </span>
    </ng-template>

    <ng-template uiCell="rate" let-row let-value="value">
      <span class="builders-page__num">{{ value }}</span>
    </ng-template>

    @if (canManageBuilders()) {
      <ng-template uiRowActions let-row>
        <button
          type="button"
          ui-button
          variant="secondary"
          size="sm"
          data-testid="edit-builder"
          [attr.aria-label]="'Edit ' + row.businessName"
          (click)="openBuilder(row)"
        >
          Edit
        </button>
      </ng-template>
    }
  </ui-data-table>
</div>
