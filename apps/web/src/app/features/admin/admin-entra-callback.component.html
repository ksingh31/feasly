<main class="admin-login">
  <div class="admin-login__card">
    <p class="admin-login__eyebrow">Admin portal</p>
    <h1>Signing you in</h1>

    @if (status() === 'verifying') {
      <p class="admin-login__intro" role="status">Completing your Microsoft sign-in…</p>
    } @else {
      <p class="admin-login__errorbox" role="alert">
        {{ errorText() }}
      </p>
      <button type="button" class="admin-login__submit" (click)="backToLogin()">
        Back to sign in
      </button>
    }
  </div>
</main>
