<main class="admin-forgot">
  <div class="admin-forgot__card">
    <p class="admin-forgot__eyebrow">Admin portal</p>
    <h1>Reset your password</h1>
    <p class="admin-forgot__intro">
      {{ copy.forgotPasswordIntro }}
    </p>

    @if (status() === 'sent') {
      <p class="admin-forgot__sent" role="status">
        {{ copy.forgotPasswordSent }}
      </p>
      <a class="admin-forgot__link" routerLink="/admin/login"> Back to sign in </a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="admin-forgot__field">
          <span>Email address</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            inputmode="email"
            [attr.aria-invalid]="emailInvalid"
            placeholder="you@example.com"
          />
        </label>
        @if (emailInvalid) {
          <p class="admin-forgot__error" role="alert">Enter a valid email address.</p>
        }
        @if (status() === 'error') {
          <p class="admin-forgot__error" role="alert">
            Something went wrong. Please try again.
            <button type="button" (click)="retry()">Retry</button>
          </p>
        }
        <button
          type="submit"
          class="admin-forgot__submit"
          [disabled]="form.invalid || status() === 'sending'"
        >
          @if (status() === 'sending') {
            Sending…
          } @else {
            Send reset link
          }
        </button>
      </form>
      <a class="admin-forgot__link" routerLink="/admin/login"> Back to sign in </a>
    }
  </div>
</main>
