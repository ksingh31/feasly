<div class="disputes-page">
  <ui-page-header
    heading="Disputes"
    description="Open billing disputes, oldest first. Each has 5 business days to resolve (Mountain Time). A breach alerts ops and never auto-resolves."
  >
    <button
      uiPageHeaderActions
      type="button"
      ui-button
      variant="secondary"
      data-testid="disputes-refresh"
      [disabled]="listStatus() === 'loading'"
      [loading]="listStatus() === 'loading'"
      (click)="reload()"
    >
      Refresh
    </button>
  </ui-page-header>

  @if (listStatus() !== 'loading' && listStatus() !== 'error' && disputes().length > 0) {
    <p class="disputes-page__count" data-testid="disputes-count">{{ countLabel() }}</p>
  }

  <ui-data-table
    label="Open disputes"
    [rows]="disputes()"
    [columns]="columns"
    [rowId]="rowId"
    [rowFlagged]="isBreached"
    [loading]="listStatus() === 'loading'"
    [error]="listStatus() === 'error' ? (listError() ?? 'Could not load disputes.') : null"
    [selectedId]="openId()"
    emptyHeading="No open disputes"
    emptyMessage="The queue is clear."
    errorHeading="Couldn’t load disputes"
    loadingLabel="Loading disputes"
    (open)="openDispute($event)"
    (retry)="reload()"
  >
    <ng-template uiCell="invoice" let-d>
      <ui-entity-link
        kind="invoice"
        [entityId]="d.invoiceId"
        [label]="entityCopy.viewInvoice"
        [copyLabel]="entityCopy.copyId"
        [copiedLabel]="entityCopy.idCopied"
        (opened)="openInvoice($event)"
      />
    </ng-template>
    <ng-template uiCell="sla" let-d>
      <ui-status-chip domain="disputeSla" [status]="sla(d).key" [label]="sla(d).label" data-testid="sla-chip" />
    </ng-template>
  </ui-data-table>
</div>
