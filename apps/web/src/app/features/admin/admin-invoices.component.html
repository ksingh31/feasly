<div class="invoices-page">
  <ui-page-header
    heading="Invoices"
    description="Every commission invoice across builders, newest first. Open one to see its activity, change the rate or payment method, or record a payment."
  />

  @if (listError(); as err) {
    <div class="invoices-page__banner invoices-page__banner--error" role="alert">
      <span>{{ err }}</span>
      <button type="button" (click)="dismissError()" aria-label="Dismiss error">
        Dismiss
      </button>
    </div>
  }

  <form
    class="invoices-page__filters"
    [formGroup]="filtersForm"
    aria-label="Invoice filters"
  >
    <label class="invoices-page__filter">
      <span class="invoices-page__filter-label">Status</span>
      <select formControlName="status" (change)="onStatusChange()" aria-label="Filter by status">
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
    <label class="invoices-page__filter">
      <span class="invoices-page__filter-label">Invoice number</span>
      <input
        type="search"
        formControlName="invoiceNumber"
        placeholder="e.g. INV-0042"
        aria-label="Search by invoice number"
      />
    </label>
    @if (hasActiveFilters()) {
      <button
        type="button"
        class="invoices-page__clear"
        (click)="clearFilters()"
      >
        Clear filters
      </button>
    }
  </form>

  <ui-data-table
    label="Invoices"
    [rows]="invoices()"
    [columns]="columns"
    [rowId]="rowId"
    [loading]="listStatus() === 'loading'"
    [error]="listStatus() === 'error' && invoices().length === 0 ? (listError() ?? 'Could not load invoices.') : null"
    [filtered]="hasActiveFilters()"
    [selectedId]="openId()"
    emptyHeading="No invoices yet"
    emptyMessage="No commission invoices exist yet."
    noResultsHeading="No invoices found"
    noResultsMessage="Nothing matches these filters — try clearing them."
    errorHeading="Couldn’t load invoices"
    retryLabel="Try again"
    (retry)="retry()"
    (clearFilters)="clearFilters()"
    (open)="openRow($event)"
  />

  @if (invoices().length > 0 || page() > 1) {
    <nav class="invoices-page__pagination" aria-label="Invoice pages">
      <button
        type="button"
        (click)="prevPage()"
        [disabled]="page() <= 1 || listStatus() === 'loading'"
      >
        Previous
      </button>
      <span class="invoices-page__page" role="status">
        Page {{ page() }}
        @if (total() !== null) {
          of {{ total() }}
        }
      </span>
      <button
        type="button"
        (click)="nextPage()"
        [disabled]="!hasNextPage() || listStatus() === 'loading'"
      >
        Next
      </button>
    </nav>
  }
</div>
