<app-site-nav />
<main class="communities-index" id="main-content" tabindex="-1">
  <div class="communities-index__inner">
    <p class="eyebrow"><span class="eyebrow-line" aria-hidden="true"></span>Calgary</p>
    <h1>Calgary Community Guides</h1>
    <p class="lede">{{ indexCopy.intro }}</p>

    @for (section of sections; track section.id) {
      <section class="community-section" [attr.aria-labelledby]="'community-section-' + section.id">
        <h2 class="section-heading" [id]="'community-section-' + section.id">{{ section.heading }}</h2>
        <p class="section-body">{{ section.body }}</p>
        <ul class="community-grid">
          @for (c of section.communities; track c.slug) {
            <li>
              <a class="community-card" [routerLink]="communityLink(c)">
                <h3>{{ c.name }}</h3>
                <p class="assessed">
                  Avg. assessed value
                  <strong>{{ assessedValue(c) }}</strong>
                </p>
                <span class="card-cta" aria-hidden="true">{{ cardCta(c) }}</span>
              </a>
            </li>
          }
        </ul>
      </section>
    }
  </div>
</main>
<app-site-footer />
