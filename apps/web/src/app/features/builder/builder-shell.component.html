<div class="builder-shell">
  <header class="builder-shell__header">
    <span class="builder-shell__brand">{{ copy.shellBrand }}</span>
    <nav class="builder-shell__nav">
      <a routerLink="/builder" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        {{ copy.shellNavDashboard }}
      </a>
      <a routerLink="/builder/billing" routerLinkActive="active">
        {{ copy.shellNavBilling }}
      </a>
      @if (isBuilderAdmin()) {
        <a routerLink="/builder/team" routerLinkActive="active">
          {{ copy.teamNavLabel }}
        </a>
      }
      @if (activeOrgName(); as orgName) {
        <a
          routerLink="/builder/org-picker"
          class="builder-shell__org"
          [attr.aria-label]="copy.orgSwitcherLabel + ': ' + orgName"
        >
          {{ orgName }}
        </a>
      }
      <a routerLink="/builder/report-contract" routerLinkActive="active">
        {{ copy.shellNavReportContract }}
      </a>
      @if (session(); as s) {
        <span class="builder-shell__email">{{ s.email }}</span>
      }
      <button type="button" (click)="signOut()">{{ copy.signOutLabel }}</button>
    </nav>
  </header>
  <main class="builder-shell__main">
    <router-outlet />
  </main>
</div>
