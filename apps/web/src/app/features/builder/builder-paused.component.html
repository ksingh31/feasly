<section class="paused" data-testid="account-paused" aria-labelledby="builder-paused-heading">
  <span class="paused__icon" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
      <path d="M10 9v6M14 9v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  </span>
  <h1 #heading id="builder-paused-heading" class="paused__heading" tabindex="-1">{{ copy.heading }}</h1>
  <p class="paused__body" data-testid="account-paused-message">{{ message() || copy.body }}</p>
  @if (isAdmin()) {
    <p class="paused__note">{{ copy.invoicesNote }}</p>
  }
  <div class="paused__actions">
    <a ui-button routerLink="/builder/settings" [queryParams]="{ tab: 'help' }" data-testid="paused-contact">
      {{ copy.contactLabel }}
    </a>
    @if (isAdmin()) {
      <a ui-button variant="secondary" routerLink="/builder/invoices" data-testid="paused-invoices">
        {{ copy.invoicesLabel }}
      </a>
    }
  </div>
</section>
