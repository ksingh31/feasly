<main class="builder-login">
  <div class="builder-login__card">
    <p class="builder-login__eyebrow">{{ copy.shellBrand }}</p>
    <h1>{{ copy.loginHeading }}</h1>

    @if (showExpired) {
      <p class="builder-login__notice" role="status">
        {{ copy.loginExpired }}
      </p>
    }

    @if (entra.isConfigured()) {
      <p class="builder-login__intro">
        {{ copy.entraSignInIntro }}
      </p>
      <button
        type="button"
        class="builder-login__submit"
        (click)="signIn()"
        [disabled]="redirecting()"
      >
        {{ redirecting() ? copy.entraRedirecting : copy.entraSignInLabel }}
      </button>
    } @else {
      <p class="builder-login__errorbox" role="alert">
        {{ copy.entraNotConfigured }}
      </p>
    }
  </div>
</main>
