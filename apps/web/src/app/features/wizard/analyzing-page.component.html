    <app-site-nav />
    <main class="wrap analyzing">
      <h1 class="analyzing-heading">{{ copy.heading }}</h1>
      <p class="analyzing-sub">{{ copy.sub }}</p>

      <ol class="stages" aria-live="polite">
        @for (stage of stages; track stage.key) {
          <li class="stage" [attr.data-state]="stage.state">
            <span class="stage-icon" aria-hidden="true"></span>
            <span class="stage-label">{{ stage.label }}</span>
            <span class="sr-only">{{ stageStatus(stage) }}</span>
          </li>
        }
      </ol>

      @if (failed) {
        <div class="error-card" role="alert">
          <h2>{{ copy.errorHeading }}</h2>
          <p>{{ copy.errorBody }}</p>
          <button class="cta" type="button" (click)="retry()">{{ copy.retryLabel }}</button>
        </div>
      }
    </main>
    <app-site-footer />
