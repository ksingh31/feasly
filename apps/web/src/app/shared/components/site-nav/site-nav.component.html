<nav class="nav" aria-label="Primary">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <a class="nav-brand" href="/" (click)="goHome($event)" [attr.aria-label]="siteName + ' home'">
    <app-brand-mark />
    <span class="nav-wordmark">{{ siteName }}</span>
  </a>

  @if (search()) {
    <!-- #783: one search box — address or community. Desktop bar; on
         phones it sits at the top of the menu instead. -->
    <div class="nav-search">
      <app-address-autocomplete [compact]="true" [communities]="true" [navigateAddresses]="true" />
    </div>
  }

  <!-- Desktop inline nav (UX audit 2026-09-28) -->
  <div class="nav-links">
    @for (link of navLinks; track link.path) {
      <a class="nav-link" [href]="link.path" (click)="go($event, link.path)">{{ link.label }}</a>
    }
  </div>

  <!-- Mobile hamburger (UX audit 2026-09-28) -->
  <button
    type="button"
    #menuBtn
    class="nav-menu-btn"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="site-nav-menu"
    aria-label="Menu"
  >
    <span class="nav-menu-icon" aria-hidden="true"></span>
  </button>
</nav>

@if (menuOpen()) {
  <!-- Scrim (review 2026-11-13 S6): dims the page so the menu never reads
       as part of the H1; tapping it closes the menu. -->
  <div class="nav-scrim" aria-hidden="true" (click)="closeMenu()"></div>
  <div class="nav-menu" id="site-nav-menu">
    @if (search()) {
      <div class="nav-menu-search">
        <app-address-autocomplete [compact]="true" [communities]="true" [navigateAddresses]="true" />
      </div>
    }
    @for (link of menuLinks; track link.label) {
      <a class="nav-menu-link" [href]="href(link)" (click)="go($event, link.path, link.queryParams)">{{
        link.label
      }}</a>
    }
    <a class="nav-menu-cta" [href]="href(menuCta)" (click)="go($event, menuCta.path)">{{
      menuCta.label
    }}</a>
  </div>
}
