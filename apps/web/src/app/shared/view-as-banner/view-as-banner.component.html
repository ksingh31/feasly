@if (banner; as viewAs) {
  <div class="view-as-banner" role="status" aria-live="polite">
    <span class="view-as-banner__text">
      @if (viewAs.displayName) {
        Viewing as <strong>{{ viewAs.displayName }}</strong>
      } @else {
        The account you were viewing is no longer available
      }
      @if (viewAs.realEmail) {
        <span class="view-as-banner__real"
          >(signed in as {{ viewAs.realEmail }} — actions are logged)</span
        >
      }
    </span>
    <button
      type="button"
      class="view-as-banner__exit"
      (click)="exitViewAs()"
    >
      Exit
    </button>
  </div>
}
