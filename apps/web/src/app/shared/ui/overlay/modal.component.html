<div
  class="ui-modal__sheet"
  [class.ui-modal__sheet--dragging]="dragOffset() > 0"
  [style.transform]="dragTransform()"
>
  <span
    class="ui-modal__handle"
    [class.ui-modal__handle--swipeable]="swipeable"
    aria-hidden="true"
    (pointerdown)="onHandleDown($event)"
    (pointermove)="onHandleMove($event)"
    (pointerup)="onHandleUp()"
    (pointercancel)="onHandleUp()"
  ></span>
  <header class="ui-modal__header">
    <h2 class="ui-modal__title" [id]="titleId">{{ heading() }}</h2>
  </header>

  @if (asForm()) {
    <form class="ui-modal__form" novalidate (submit)="onSubmit($event)">
      <ng-container [ngTemplateOutlet]="content" />
    </form>
  } @else {
    <ng-container [ngTemplateOutlet]="content" />
  }

  <ng-template #content>
    <div class="ui-modal__body" [id]="bodyId"><ng-content /></div>
    <div class="ui-modal__footer"><ng-content select="[uiModalFooter]" /></div>
  </ng-template>

  @if (closable()) {
    <!-- Last in DOM so it never takes initial focus; placed top-right by CSS. -->
    <button
      type="button"
      class="ui-modal__close"
      [attr.aria-label]="closeLabel()"
      [disabled]="closeLocked()"
      (click)="close()"
    >
      <span aria-hidden="true">×</span>
    </button>
  }
</div>
