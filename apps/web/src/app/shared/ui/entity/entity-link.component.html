<span class="entity-link" (pointerleave)="reset()" (focusout)="reset()">
  <button type="button" class="entity-link__label" [attr.title]="label()" (click)="open()">
    {{ label() }}
  </button>
  @if (copyable()) {
    <button
      type="button"
      class="entity-link__copy"
      [class.entity-link__copy--done]="justCopied()"
      [attr.aria-label]="copyAriaLabel()"
      [attr.title]="copyLabel()"
      (click)="copy()"
    >
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
        @if (justCopied()) {
          <path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.6" />
        } @else {
          <rect x="5" y="5" width="8" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4" />
          <path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H10" fill="none" stroke="currentColor" stroke-width="1.4" />
        }
      </svg>
    </button>
  }
  <span class="sr-only" aria-live="polite">{{ justCopied() ? copiedLabel() : '' }}</span>
</span>
