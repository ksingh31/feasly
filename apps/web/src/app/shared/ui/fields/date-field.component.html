<ui-field-shell
  [label]="label()"
  [controlId]="controlId()"
  [hintId]="hintId()"
  [errorId]="errorId()"
  [hint]="hint()"
  [error]="error()"
  [required]="required()"
>
  <input
    class="ui-field__control"
    type="date"
    [id]="controlId()"
    [value]="value() ?? ''"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.min]="min()"
    [attr.max]="max()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($any($event.target).value)"
    (blur)="markTouched()"
  />
</ui-field-shell>
