<label class="ui-field__label" [attr.for]="controlId()">
  {{ label() }}@if (required()) {<span class="ui-field__required" aria-hidden="true"> *</span>}
</label>
<ng-content />
@if (error()) {
  <p class="ui-field__error" [id]="errorId()">{{ error() }}</p>
} @else if (hint()) {
  <p class="ui-field__hint" [id]="hintId()">{{ hint() }}</p>
}
