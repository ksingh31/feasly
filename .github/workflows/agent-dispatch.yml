# Agent pipeline — dispatcher (no AI). Hands `agent:ready` issues to dev
# agents up to AGENT_MAX_WIP in flight. Runbook: docs/agents.md.
name: Agent · Dispatch

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 * * * *' # hourly backstop
  workflow_dispatch:

concurrency:
  group: agent-dispatch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read # watchdog lists agent PRs
  actions: write # gh workflow run agent-dev.yml

jobs:
  dispatch:
    if: >-
      vars.AGENTS_ENABLED == 'true' &&
      (github.event_name != 'issues' || github.event.label.name == 'agent:ready')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Hourly: catch stalled claims / stale PRs within the hour, not twice a day.
      - name: Watchdog (scheduled runs only)
        if: github.event_name == 'schedule'
        run: node tools/agents/watchdog.mjs --out /tmp/watchdog-summary.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_CLAIM_STALL_HOURS: ${{ vars.AGENT_CLAIM_STALL_HOURS }}
          AGENT_PR_STALE_HOURS: ${{ vars.AGENT_PR_STALE_HOURS }}
          AGENT_CI_RED_HOURS: ${{ vars.AGENT_CI_RED_HOURS }}
      - run: node tools/agents/dispatch.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_MAX_WIP: ${{ vars.AGENT_MAX_WIP }}
