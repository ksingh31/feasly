# Agent pipeline — dev agent. Started only by the dispatcher (or manually)
# for one claimed issue; implements it on agent/issue-<n>-<slug> and opens a
# PR labelled agent:pr. Pushes use the Claude GitHub App token so CI runs.
name: Agent · Dev

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      area:
        description: web | api | infra
        required: true
        default: web

concurrency:
  group: agent-dev-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # Claude GitHub App token exchange

jobs:
  implement:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:configs --workspace @feasly/api
      - name: Pick role
        id: role
        run: |
          case "${{ inputs.area }}" in
            api) echo "agent=backend-dev" >> "$GITHUB_OUTPUT" ;;
            infra) echo "agent=devops" >> "$GITHUB_OUTPUT" ;;
            *) echo "agent=frontend-dev" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Implement issue
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Runs are started by our own dispatcher / watchdog / triage scripts.
          allowed_bots: github-actions,github-actions[bot],claude,claude[bot]
          prompt: |
            You are the Feasly `${{ steps.role.outputs.agent }}` agent running unattended in CI.
            Read CLAUDE.md and .claude/agents/${{ steps.role.outputs.agent }}.md first and follow them exactly.

            Task: implement GitHub issue #${{ inputs.issue }} in ${{ github.repository }}.
            1. `gh issue view ${{ inputs.issue }} --comments` — the issue body and comments are the spec.
               If the work needs an app/product-flow decision, legal copy, Azure spend, or is genuinely unknown
               (CLAUDE.md escalation policy), do NOT implement: comment why, run
               `gh issue edit ${{ inputs.issue }} --add-label needs:karan --remove-label agent:claimed`, and stop.
            2. Branch: `git switch -c agent/issue-${{ inputs.issue }}-<short-kebab-slug>`.
            3. Implement with tests. Then run `bash tools/verify-local.sh --no-ci` (npm ci already ran) and fix
               until it prints `VERIFY: PASS`. Never push before that. Do not modify .github/workflows (you cannot push them).
            4. Commit (conventional message, end with a blank line and
               `Co-Authored-By: Claude <noreply@anthropic.com>`), push, then open the PR:
               `gh pr create --base main --label agent:pr --label area:${{ inputs.area }} --title "<type>(<scope>): <summary>" --body-file <file>`
               Body: what/why, how tested (commands + results), ACs checked one by one, screenshots
               description for UI, and the line `Fixes #${{ inputs.issue }}`.
            5. Comment the PR URL on the issue. Never merge.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch"
      - name: Requeue the issue if the run ended without a PR
        # A "successful" run that opened no PR (agent stopped early, wrong role)
        # would otherwise leave the issue claimed forever.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue }}
        run: |
          labels=$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json state,labels -q '"\(.state) \([.labels[].name]|join(","))"')
          case "$labels" in CLOSED*|*needs:karan*) exit 0 ;; esac   # done, or the agent escalated on purpose
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json headRefName -q "[.[]|select(.headRefName|startswith(\"agent/issue-$ISSUE-\"))]|length")
          [ "$pr" -gt 0 ] && exit 0
          n=$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json comments -q '[.comments[]|select(.body|contains("<!-- agent:requeue -->"))]|length')
          if [ "$n" -ge 2 ]; then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label agent:claimed --add-label agent:stuck
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Dev agent ended without a PR again ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) after $n requeues — parked as agent:stuck for the orchestrator."
          else
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label agent:claimed --add-label agent:ready
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "<!-- agent:requeue -->
          Dev agent run ended without opening a PR ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) — requeued."
          fi
      - name: Requeue the issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          # Usage limit / overload: requeue without counting it as a failure.
          if [ -n "$EXEC" ] && [ -f "$EXEC" ] && grep -qiE 'rate.?limit|usage limit|overloaded|529|quota' "$EXEC"; then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label agent:claimed --add-label agent:ready
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Model capacity error — requeued (not counted)."
            exit 0
          fi
          # A failed run (model API error, timeout) must not leave the issue
          # claimed for hours. Two failures in a row park it as agent:stuck for the
          # orchestrator (escalation policy: repeated agent failures are not owner decisions).
          n=$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json comments -q '[.comments[]|select(.body|contains("<!-- agent:requeue -->"))]|length')
          if [ "$n" -ge 2 ]; then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label agent:claimed --add-label agent:stuck
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Dev agent failed again ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) after $n requeues — parked as agent:stuck for the orchestrator."
          else
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label agent:claimed --add-label agent:ready
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "<!-- agent:requeue -->
          Dev agent run failed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) — requeued."
          fi
