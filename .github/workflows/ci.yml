name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # EMB-02: the embed-config composition imports the generated
      # builder-config module. Regenerate it here (and fail if the committed
      # copy is stale) so `npx tsc -b` below never sees a missing module.
      - run: npm run build:configs --workspace @feasly/api
      - run: git diff --quiet -- apps/api/src/generated/ || (echo "::error::apps/api/src/generated/builder-configs.ts is stale — run 'npm run build:configs --workspace @feasly/api' and commit the result" && exit 1)
      - run: npx tsc -b
      - run: npm run test --workspaces --if-present
      - run: npm run lint --workspaces --if-present
      # SEO-01: production build + prerendered-SEO regression (per-page tags,
      # canonicals, noindex, 404 copy, 1200x630 OG image). Local: `npm run
      # verify:seo` inside apps/web.
      - run: npm run build --workspace=@feasly/web -- --configuration=production
      - run: node tools/check-prerender-seo.mjs
        working-directory: apps/web
      # HRD-06: repo-owned health-check tests (mocked endpoints — no network,
      # no Azure). Fails the build if a check or the alert dedupe regresses.
      - run: bash infra/health/test/test-checks.sh

  # HRD-04: assert PITR-capable backup config on the Postgres (read-only).
  # Failing here is the "scheduled backup missed" signal until admin/06 wires
  # a dedicated alert class. OIDC trust covers main pushes + PRs (docs/oidc-setup.md).
  backup-config:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Assert Postgres backup config (PITR-capable)
        run: bash infra/health/check-postgres-backup.sh
